[project]
name = "django-autotranslate"
version = "2.0.0"
description = "Automatically translate the pot (.po) files generated by Django's makemessages command using machine translation services."
requires-python = ">=3.11,<4.0"
authors = [
  {name = "Ankit Popli", email = "ankitpopli1891@gmail.com"},
  {name = "Brian Kohan", email = "bckohan@gmail.com"},
]
license = "MIT"
license-files = [ "LICENSE" ]

readme = "README.md"
repository = "https://github.com/ankitpopli1891/django-autotranslate"
homepage = "https://django-autotranslate.readthedocs.io"
keywords = ["django", "i18n", "translate", "cli"]
dependencies = [
    "Django>=5.2,<6.2",
    "django-typer>=4,<5",
    "googletrans>=4.0.2",
    "polib>=1.2.0",
]
classifiers = [
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]

[project.optional-dependencies]
google = ["google-api-python-client>=2.162.0"]
amazon = ["boto3>=1.37.1"]
progress = ["tqdm>=4.66.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
conflicts = [
  [
    { group = "dj52" },
    { group = "dj61" },
  ],
]

[tool.hatch.build.targets.wheel]
packages = ["src/autotranslate"]

[project.urls]
"Homepage"      = "https://django-autotranslate.readthedocs.io"
"Documentation" = "https://django-autotranslate.readthedocs.io"
"Repository"    = "https://github.com/ankitpopli1891/django-autotranslate"
"Issues"        = "https://github.com/ankitpopli1891/django-autotranslate/issues"
"Changelog"     = "https://django-autotranslate.readthedocs.io/en/latest/changelog.html"


[dependency-groups]
docs = [
    "doc8>=1.1.2",
    "furo>=2024.8.6",
    "readme-renderer[md]>=44.0",
    # sphinxcontrib-typer fails on typer directives in autodoc docstrings under sphinx 9
    "sphinx>=8.0.0,<9",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-tabs>=3.4.7",
    "sphinxcontrib-django>=2.5",
    "sphinxcontrib-typer[png]>=0.10.0",
]
dj52          = ["Django>=5.2,<6.0"]
dj61          = ["Django>=6.1,<6.2; python_version >= '3.12'"]
typing = [
    "pyright>=1.1.390",
    "mypy>=1.19.1",
    "django-stubs[compatible-mypy]>=5.1.3",
    "django-stubs-ext>=5.1.3",
]
lint = [
    "ruff>=0.15.0",
    "readme-renderer[md]>=43.0",
    "doc8>=1.1.2",
    "bandit[toml,sarif]>=1.7.10"
]
coverage  = ["coverage[toml]>=7.6.1"]
test = [
    { include-group = "coverage" },
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-django>=4.10.0",
]
dev = [
    { include-group = "typing" },
    { include-group = "test" },
    { include-group = "docs" },
    { include-group = "lint" },
    "packaging>=24.2",
    "tomlkit>=0.13.3",
    "ipdb>=0.13.13",
    "ipython>=8.18.1",
]

[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]
mypy_path = ["src"]
packages = ["autotranslate"]

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src/autotranslate"]
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportDuplicateImport = true

[tool.doc8]
max-line-length = 100
sphinx = true
ignore = [ "D004" ]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = "test*.py"
norecursedirs = "*.egg .eggs dist build docs .tox .git __pycache__"

addopts = [
    "--strict-markers",
    # live tests of the paid services, run them with just test-service <service>
    "-m", "not service",
    "--cov=autotranslate",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
]

markers = [
    "service: live (billed) tests of a paid translation service",
]

filterwarnings = [
    # typer deprecated shell_complete, but django-typer completers use that interface
    "ignore:.*shell_complete.*:DeprecationWarning:typer.core",
]

[tool.coverage.run]
branch = true
source = ["autotranslate"]
concurrency = ["thread", "multiprocessing"]
parallel = true
relative_files = true
command_line = "-m pytest --cov=autotranslate"

[tool.coverage.paths]
source = ["autotranslate"]

[tool.ruff]
line-length = 88
exclude = ["doc", "dist"]
target-version = "py311"

[tool.ruff.lint]
exclude = ["tests/**/*"]

[tool.bandit]
targets = ["src"]
exclude_dirs = [
    "./tests",
    "./.venv",
    "./doc",
]

skips = [
    "B101",  # assert_used - assertions are fine in tests and Django code
    "B110",  # Try, Except, Pass detected - these are intentional
]
