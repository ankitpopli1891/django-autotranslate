name: Test Google Cloud Translation

# Live (billed) tests of the Google Cloud Translation service (just test-service google).
#
# Requires an environment named "google-translate" with a GOOGLE_TRANSLATE_API_KEY
# secret. Add yourself as a required reviewer on the environment to approve each run.

permissions:
  contents: read

concurrency:
  group: test-google-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: google-translate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        id: sp
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: false
      - name: Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: "1.58.0"
      - name: Install gettext
        run: sudo apt-get install -y gettext
      - name: Run Google Cloud Translation tests
        env:
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
          TEST_PYTHON: ${{ steps.sp.outputs.python-path }}
        run: just test-service google -p "$TEST_PYTHON"
